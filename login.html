<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Student Login</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body class="auth-page">
<script>
(async function(){ const u = await getCurrentUser(); if(u) window.location.replace('calculator.html'); })();
</script>
<div class="auth-card">
<h1>Student Login</h1><p>Login to access the Credit Calculator.</p>
<form id="loginForm">
<label>Email</label><input id="email" type="email" required placeholder="Enter email">
<label>Password</label><input id="password" type="password" required placeholder="Enter password">
<button type="submit">Login</button>
</form>
<a class="forgot" href="forgot-password.html">Forgot Password?</a>
<p id="message" class="message"></p>
<p>Don't have an account? <a href="signup.html">Create Account</a></p>
<p><a href="index.html">← Back to Home</a></p>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
 e.preventDefault();
 const message=document.getElementById('message'); message.textContent='Logging in...';
 const {error}=await supabaseClient.auth.signInWithPassword({email:email.value.trim(),password:password.value});
 if(error){message.textContent=error.message;message.className='message error';return;}
 window.location.href='calculator.html';
});
</script>
</body></html>
