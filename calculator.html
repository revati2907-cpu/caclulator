<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Credit Calculator</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></head>
<body class="calculator-page"><header><div class="logo">College Credit Calculator</div><nav><a href="index.html">Home</a><button class="nav-button" onclick="logout()">Logout</button></nav></header><main class="calc-card"><h1>College Credit Calculator</h1><p id="welcome"></p><label>Total Required Credits</label><input id="required" type="number" min="0" value="160"><label>Credits Earned</label><input id="earned" type="number" min="0" value="0"><button onclick="calculate()">Calculate</button><div id="result" class="result"></div></main>
<script>(async()=>{const u=await requireLogin();if(u)document.getElementById('welcome').textContent='Logged in as '+(u.email||'student');})();function calculate(){const r=Number(document.getElementById('required').value),e=Number(document.getElementById('earned').value),remaining=Math.max(r-e,0),p=r?Math.min(e/r*100,100):0;document.getElementById('result').innerHTML=`<h2>Result</h2><p>Required Credits: ${r}</p><p>Earned Credits: ${e}</p><p>Remaining Credits: ${remaining}</p><p>Progress: ${p.toFixed(2)}%</p>`;}</script></body></html>
