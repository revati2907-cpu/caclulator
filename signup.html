<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Student Sign Up</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head>
<body class="auth-page">
<script>
(async function(){ const u = await getCurrentUser(); if(u) window.location.replace('calculator.html'); })();
</script><div class="auth-card">
<h1>Create Account</h1><p>Create your student account to use the Credit Calculator.</p>
<form id="signupForm">
<label>Full Name</label><input id="fullName" type="text" required placeholder="Enter full name">
<label>Email</label><input id="email" type="email" required placeholder="Enter email">
<label>Password</label><input id="password" type="password" minlength="6" required placeholder="At least 6 characters">
<label>Confirm Password</label><input id="confirmPassword" type="password" minlength="6" required placeholder="Re-enter password">
<button type="submit">Sign Up</button>
</form><p id="message" class="message"></p>
<p>Already have an account? <a href="login.html">Login</a></p><p><a href="index.html">← Back to Home</a></p>
</div>
<script>
document.getElementById('signupForm').addEventListener('submit', async (e)=>{
 e.preventDefault(); const message=document.getElementById('message');
 if(password.value!==confirmPassword.value){message.textContent='Passwords do not match.';message.className='message error';return;}
 message.textContent='Creating account...';
 const {data,error}=await supabaseClient.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{full_name:fullName.value.trim()}}});
 if(error){message.textContent=error.message;message.className='message error';return;}
 message.className='message success';
 message.textContent=data.session ? 'Account created. Redirecting to login...' : 'Account created. Check your email if confirmation is enabled, then login.';
 setTimeout(()=>window.location.href='login.html',1800);
});
</script></body></html>
