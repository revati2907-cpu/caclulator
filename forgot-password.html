<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset Password</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head>
<body class="auth-page"><div class="auth-card"><h1>Forgot Password</h1><p>Enter your email to receive a password reset link.</p>
<form id="resetForm"><label>Email</label><input id="email" type="email" required><button type="submit">Send Reset Link</button></form><p id="message" class="message"></p><p><a href="login.html">← Back to Login</a></p></div>
<script>document.getElementById('resetForm').addEventListener('submit',async(e)=>{e.preventDefault();const m=document.getElementById('message');const {error}=await supabaseClient.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:location.origin+location.pathname.replace('forgot-password.html','reset-password.html')});m.textContent=error?error.message:'Reset link sent. Check your email.';m.className=error?'message error':'message success';});</script></body></html>
