<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Set New Password</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head>
<body class="auth-page"><div class="auth-card"><h1>Set New Password</h1><form id="form"><label>New Password</label><input id="password" type="password" minlength="6" required><label>Confirm Password</label><input id="confirm" type="password" minlength="6" required><button>Update Password</button></form><p id="message" class="message"></p></div>
<script>document.getElementById('form').addEventListener('submit',async(e)=>{e.preventDefault();const m=document.getElementById('message');if(password.value!==confirm.value){m.textContent='Passwords do not match.';m.className='message error';return;}const {error}=await supabaseClient.auth.updateUser({password:password.value});if(error){m.textContent=error.message;m.className='message error';return;}m.textContent='Password updated. Redirecting to login...';m.className='message success';await supabaseClient.auth.signOut();setTimeout(()=>location.href='login.html',1200);});</script></body></html>
